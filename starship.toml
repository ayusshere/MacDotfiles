#   🌌  STARSHIP PROMPT — Catppuccin Mocha Glow
# ──────────────────────────────────────────────

add_newline = true
palette = 'cozy_cat'

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$java\
$c\
$rust\
$docker_context\
$cmd_duration\
$username\
$time\
$shell\
$line_break\
$character\
"""

# ──────────────────────────────────────────────
#  🎨 CozyCat Theme Palette
# ──────────────────────────────────────────────
[palettes.cozy_cat]
foreground = "#b6c7df"      # text
current_line = "#b6c7df"    # kept same logic, updated tone
blue = "#5aa3d9"
lavender = "#b4befe"
green = "#96c885"
yellow = "#ddd38a"
orange = "#e8a76f"
red = "#d8747f"
cyan = "#94e2d5"
rosewater = "#eed6d2"
purple = "#c694ed"


# ──────────────────────────────────────────────
# MODULE SETTINGS
# ──────────────────────────────────────────────

[os.symbols]
Alpine = ''
Amazon = ''
Android = ''
Arch = ''
CentOS = ''
Debian = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Linux = ''
Macos = ''
Manjaro = ''
Mariner = ''
Mint = ''
NetBSD = ''
NixOS = ''
OpenBSD = ''
OpenCloudOS = ''
openEuler = ''
openSUSE = ''
OracleLinux = '⊂⊃'
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Windows = ''

[os]
format = '[$symbol ](fg:red bold)'
disabled = true


[directory]
style = "bold fg:purple"
truncation_symbol = ' '
truncation_length = 2
home_symbol = "~"
read_only = ' 󰌾'
read_only_style = 'fg:red'

[fill]
symbol = ' '
style = 'fg:current_line'

[git_branch]
symbol = ' '
style = "fg:green bold"
format = "[$symbol$branch ]($style)"

[git_status]
style = 'fg:orange'
staged = '[●$count](fg:green)'      # added / staged
modified = '[~$count](fg:yellow)'   # modified
deleted = '[-$count](fg:red)'       # deleted
untracked = '[+$count](fg:blue)'    # new files
stashed = '[≡$count](fg:purple)'    # stashed
ahead = '${count}'
diverged = '󰠽${ahead_count}󰧩${behind_count}'
behind = '${count}'
format = '([$staged$modified$deleted$untracked$stashed$ahead_behind]($style)) '

[nodejs]
symbol = " "
style = "fg:green bold"
format = "[ $symbol$version]($style)"

[python]
symbol = " "
style = "fg:yellow bold"
format = "[ $symbol$version]($style)"

[java]
symbol = "󰅶 "
style = "fg:red bold"
format = "[ $symbol$version]($style)"

[c]
symbol = " "
style = "fg:cyan bold"
format = "[ $symbol$version]($style)"

[rust]
symbol = " "
style = "fg:orange bold"
format = "[ $symbol$version]($style)"

[docker_context]
symbol = " "
style = "fg:blue bold"
format = "[ $symbol$context]($style)"

[cmd_duration]
min_time = 500
format = "[  $duration]($style)"
style = "fg:orange bold"

[time]
time_format = "%H:%M"
format = "[ 󱑀 $time]($style)"
style = "fg:lavender bold"
disabled = true

[username]
format = "[  $user](bold fg:yellow)"
show_always = false

[shell]
powershell_indicator = 'Powershell'
#fish_indicator = '  FISH' sometime its irritating to show fish always so i turned it off
fish_indicator = ''
bash_indicator = '  BASH' #but i want that other shell show 
zsh_indicator = '  ZSH'
style = "fg:cyan bold"
disabled = false

[character]
success_symbol = '[❯](fg:green)'
error_symbol = '[❯](fg:red)'
vimcmd_symbol = '[❮](fg:blue)'
vimcmd_replace_symbol = '[❮](fg:purple)'
vimcmd_visual_symbol = '[󰼢](fg:orange)'



