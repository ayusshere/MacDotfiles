# =============================
# Yazi - Complete Configuration
# =============================

[mgr]
ratio = [2, 4, 3]
sort_by = "natural"
linemode = "size"
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 4
max_width = 1024
max_height = 1024
cache_dir = ""
image_delay = 30
image_quality = 80

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = " nvim", block = true, for = "unix" },
    { run = 'codium "$@"', desc = " codium", block = true, for = "unix" },
    { run = 'code -w "$@"', desc = " vscode", block = true, for = "unix" },
    { run = 'code -w %*', desc = " vscode", block = true, for = "windows" },
]
open = [
    { run = 'xdg-open "$1"', for = "linux" },
    { run = 'open "$1"', desc = " open", for = "macos" },
    { run = 'start "" "%1"', orphan = true, for = "windows" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', for = "linux" },
    { run = 'open -R "$1"', desc = "󰈈 reveal", for = "macos" },
    { run = 'explorer /select,"%1"', orphan = true, for = "windows" },
]
extract = [
    { run = 'ya pub extract --list "$@"', desc = " extract here", for = "unix" },
    { run = 'ya pub extract --list %*', for = "windows" },
]
play = [
    { run = 'open -a IINA "$@"', desc = " open", orphan = true, for = "macos" },
    { run = 'mpv --force-window "$@"', desc = " mpv", orphan = true, for = "unix" },
    { run = 'mpv --force-window %*', orphan = true, for = "windows" },
]

[open]
rules = [
    # ───────────────── Directories ─────────────────
    { mime = "inode/directory", use = [
        "edit",
        "open",
        "reveal",
    ] },
    { mime = "application/x-apple-diskimage", use = "finder" },
    # ───────────────── Text / Code ─────────────────
    { mime = "text/*", use = [
        "edit",
        "reveal",
    ] },
    { mime = "application/json", use = [
        "edit",
        "reveal",
    ] },
    { mime = "application/xml", use = [
        "edit",
        "reveal",
    ] },
    { mime = "application/x-yaml", use = [
        "edit",
        "reveal",
    ] },
    { mime = "application/toml", use = [
        "edit",
        "reveal",
    ] },
    { mime = "text/markdown", use = [
        "edit",
        "reveal",
    ] },

    # ───────────────── Images ─────────────────
    { mime = "image/*", use = [
        "open",
        "reveal",
        "set-wallpaper",
    ] },

    # ───────────────── Fonts ─────────────────
    { mime = "font/*", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/font-sfnt", use = [
        "open",
        "reveal",
    ] },
    # ───────────────── Audio / Video ─────────────────
    { mime = "audio/*", use = [
        "play",
        "reveal",
    ] },
    { mime = "video/*", use = [
        "play",
        "reveal",
    ] },
    # ───────────────── PDFs / Docs ─────────────────
    { mime = "application/pdf", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/msword", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = [
        "open",
        "reveal",
    ] },

    # ───────────────── Archives ─────────────────
    { mime = "application/zip", use = [
        "extract",
        "reveal",
    ] },
    { mime = "application/x-tar", use = [
        "extract",
        "reveal",
    ] },
    { mime = "application/gzip", use = [
        "extract",
        "reveal",
    ] },
    { mime = "application/x-7z-compressed", use = [
        "extract",
        "reveal",
    ] },
    { mime = "application/x-rar", use = [
        "extract",
        "reveal",
    ] },

    # ───────────────── Disk Images / Installers ─────────────────
    { mime = "application/vnd.apple.installer+xml", use = [
        "open",
        "reveal",
    ] },

    { url = "*.dmg", use = [
        "open",
        "reveal",
    ] },

    # ───────────────── Executables / Binaries ─────────────────
    { mime = "application/x-mach-binary", use = [
        "open",
        "reveal",
    ] },
    { mime = "application/octet-stream", use = [
        "open",
        "reveal",
    ] },

    # ───────────────── Empty / Unknown ─────────────────
    { mime = "inode/empty", use = [
        "edit",
        "reveal",
    ] },

    # ───────────────── FINAL FALLBACK ─────────────────
    { use = [
        "reveal",
    ] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
prepend_fetchers = [
    { id = "git", name = "*", run = "git" },
    { id = "git", name = "*/", run = "git" },
]
prepend_previewers = [{ name = "*/", run = "eza-preview" }]

[input]
cursor_blink = true

cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

quit_title = "Quit?"
quit_content = "The following task is still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false

[[opener.set-wallpaper]]
run = 'osascript -e "tell application \"System Events\" to set picture of every desktop to POSIX file \"$1\"" -- %s'
for = "macos"
desc = " set as wallpaper"
